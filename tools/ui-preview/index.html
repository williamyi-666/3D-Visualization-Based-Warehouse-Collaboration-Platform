<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓储空间 · 界面预览</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#243448;background:#edf1f5;font-size:14px;--line:#e4e9ef;--blue:#2464eb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:inherit;padding:9px 13px;border-radius:7px}button:hover{background:#edf3ff;border-color:#b7ccf6}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #99baff;outline-offset:2px}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1853cb}.muted{color:#748398;font-size:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.logo{background:#2464eb;color:white;padding:5px 8px;border-radius:7px}.shell{height:100dvh;display:grid;grid-template-columns:192px 1fr;grid-template-rows:60px 1fr}.header{grid-column:1/-1;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.preview{color:#8b6a27;background:#fff7df;border-radius:5px;padding:5px 10px;font-size:12px}.nav{background:#fff;border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:8px}.nav button{text-align:left;border:0;padding:13px 16px;background:transparent;color:#627186}.nav button.active{background:#edf3ff;color:var(--blue);font-weight:600}.nav small{padding:0 16px 12px;color:#98a3b2;font-size:11px;letter-spacing:2px}.nav .bottom{margin-top:auto}.workspace{min-width:0;min-height:0;display:flex;flex-direction:column}.pagehead{padding:24px 26px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;letter-spacing:-.5px;margin:0 0 6px}h2{font-size:15px;margin:0}h3{font-size:13px;margin:0}.row{display:flex;align-items:center;gap:10px}.toolbar{display:flex;gap:8px;align-items:center;padding:0 26px 18px;flex-wrap:wrap}input,select{border:1px solid #dce3eb;background:white;padding:10px 12px;border-radius:7px;color:inherit;min-width:0}input[type=search]{width:310px}.toolbar .spacer{flex:1}.status{color:#227b59;background:#eaf6ef;padding:6px 9px;font-size:12px;border-radius:5px}.body{margin:0 26px 24px;display:flex;flex:1;min-height:0;gap:16px}.canvas{position:relative;flex:1;min-width:0;border:1px solid #dae2eb;border-radius:12px;background:radial-gradient(ellipse at center,#fafcff,#e5edf4);overflow:hidden}.canvas svg{width:100%;height:100%;min-height:260px}.canvashead{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#ffffffed;border:1px solid #e0e6ef;border-radius:7px;padding:8px 11px;font-size:12px}.viewtools{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:white;padding:4px;border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 15px #27456a12;white-space:nowrap}.viewtools button{border:0;font-size:12px}.panel{width:304px;flex-shrink:0;background:white;border:1px solid var(--line);border-radius:12px;overflow:auto;resize:horizontal;min-width:264px;max-width:440px}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}.section{padding:20px;border-bottom:1px solid #edf0f4}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric b{display:block;font-size:26px;font-weight:600;margin:6px 0}.tiny{font-size:11px;color:#8591a0}.record{width:100%;text-align:left;display:block;padding:14px 0;border:0;border-bottom:1px solid #edf0f4;border-radius:0}.record strong{font-weight:500;display:block;margin-bottom:7px}.record .muted{display:block}.badge{font-size:11px;background:#edf3ff;color:#3166c8;border-radius:4px;padding:3px 6px}.field{display:block;margin-top:16px;color:#617083;font-size:12px}.field input,.field select{width:100%;margin-top:7px;font-size:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panelactions{position:sticky;bottom:0;padding:16px 20px;background:white;border-top:1px solid var(--line);display:flex;gap:8px}.tree{width:174px;flex-shrink:0;background:white;border:1px solid var(--line);border-radius:12px;padding:17px 12px}.tree button{width:100%;text-align:left;border:0;margin-top:8px;font-size:13px}.tree button.active{background:#edf3ff;color:var(--blue)}.tree h3{padding:0 8px 12px}.tablewrap{flex:1;min-width:0;background:white;border:1px solid var(--line);border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:16px;border-bottom:1px solid #edf0f4;font-size:13px}th{color:#8290a2;font-size:12px;font-weight:500;background:#fafbfd;position:sticky;top:0}tr[data-id]{cursor:pointer}tr.selected{background:#eff5ff}td:first-child{width:38px}td strong{display:block;font-weight:500}td small{display:block;color:#8b97a5;margin-top:5px}.empty{padding:30px;color:#8290a2}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263b54;color:white;padding:12px 20px;border-radius:8px;box-shadow:0 4px 20px #0002;z-index:5}.hidden{display:none!important}.footnote{position:absolute;bottom:18px;left:18px;color:#7d8fa3;font-size:11px}.rack{cursor:pointer}.rack:hover{filter:brightness(.94)}.rack.selected{filter:drop-shadow(0 0 5px #3c83ff)}.label{font-size:12px;fill:#62778c}.filters{padding:0 26px 14px;display:flex;gap:8px}.system{margin:0 26px;background:white;padding:30px;border:1px solid var(--line);border-radius:12px;max-width:850px}.system p{line-height:1.9;color:#748398}.backdrop{display:none}
@media(min-width:1550px){.panel{width:340px}.canvashead{top:24px;left:24px}.pagehead{padding-top:30px}}
@media(max-width:1100px){.shell{grid-template-columns:148px 1fr}.panel{width:264px}.body{gap:10px;margin:0 16px 16px}.pagehead{padding:20px 16px 16px}.toolbar{padding:0 16px 14px}.tree{width:135px}.header{padding:0 16px}.nav{padding:20px 6px}.nav button{padding:12px}.preview{max-width:165px}.footnote{display:none}}
@media(max-width:850px){.shell{grid-template-columns:1fr;grid-template-rows:54px 48px 1fr}.header{grid-column:1}.nav{flex-direction:row;padding:4px 12px;border-bottom:1px solid var(--line);border-right:0;overflow:auto}.nav small,.nav .bottom{display:none}.nav button{white-space:nowrap;padding:8px 12px}.panel{position:fixed;right:12px;top:115px;bottom:16px;width:min(340px,calc(100vw - 24px));z-index:3;box-shadow:0 15px 80px #20375344;resize:none}.tree{width:126px}.pagehead h1{font-size:19px}.pagehead .muted{max-width:260px}.toolbar input[type=search]{width:200px;flex:1}.preview{font-size:10px}.body{min-height:260px}.header .brand{font-size:15px}.viewtools{bottom:12px}.panel.hidden{display:none!important}}
</style>
<div class="shell">
 <header class="header"><div class="brand"><span class="logo">W</span> 仓储空间 <span class="muted">/ Open supOS</span></div><span class="preview">界面原型 · 示例数据，不写入业务系统</span></header>
 <nav class="nav"><small>工作空间</small><button data-page="inventory" class="active">◫　库存查看</button><button data-page="design">▧　空间设计</button><button data-page="cells">▦　格位管理</button><button data-page="system">⚙　系统管理</button><div class="bottom muted">主仓库 · 空间管理员</div></nav>
 <main class="workspace" id="workspace"></main>
</div><div id="toast" class="toast hidden" role="status"></div>
<script>
// 独立界面原型：数据仅存在内存中，刷新恢复，不调用业务 API。
const records=Array.from({length:18},(_,i)=>({id:i,code:`WH-1-${'ABC'[Math.floor(i/6)]}-L01-B0${i%6+1}`,name:['标准件存储位','紧固件存储位','备品备件位'][i%3],sku:['轴承 6204','六角螺栓 M12','密封圈'][i%3],qty:[120,500,80][i%3],status:i===4?'盘点标记':'正常',load:100}));
let page='inventory',selected=0,rack='A',zoom=1,query='',filter=false,panelOpen=innerWidth>850,dirty=false;const chosen=new Set();const drafts={A:{name:'A 货架',x:-2,z:0,angle:0},B:{name:'B 货架',x:0,z:0,angle:0},C:{name:'C 货架',x:2,z:0,angle:0}};let baseline=structuredClone(drafts),history=[];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function scene(flat=false){let shapes='';for(let k=0;k<3;k++){const key='ABC'[k],d=drafts[key],x=flat?210+d.x*54:145+k*155,z=flat?205+d.z*34:175;shapes+=flat?`<g class="rack ${rack===key?'selected':''}" data-rack="${key}" transform="translate(${x},${z}) rotate(${d.angle})"><rect width="85" height="48" rx="3" fill="${rack===key?'#cfe1ff':'#e1e9f0'}" stroke="${rack===key?'#377aee':'#8fa5bb'}" stroke-width="2"/><path d="M14 0v48m14-48v48m14-48v48m14-48v48m14-48v48" stroke="#9db1c8"/><text x="42" y="-12" text-anchor="middle" class="label">${key} 货架</text></g>`:`<g class="rack ${rack===key?'selected':''}" data-rack="${key}" transform="translate(${x},${z})"><path d="M0 0l38-25h105l-38 25z" fill="#d8e4ee" stroke="#9cafc1"/><path d="M105 0l38-25v175l-38 25z" fill="#bacddc" stroke="#8ca4b9"/><rect width="105" height="175" fill="#e7eef4" stroke="#8ca4b9"/><path d="M0 35h105M0 70h105M0 105h105M0 140h105M35 0v175M70 0v175" stroke="#9bb0c3" stroke-width="3"/><rect x="4" y="109" width="27" height="27" rx="2" fill="${k===0?'#3c80ef':'#80a7be'}"/><rect x="39" y="74" width="27" height="27" rx="2" fill="#a0bbcc"/><text x="70" y="-45" text-anchor="middle" class="label">${key} 货架 · 30 格</text></g>`}
return `<svg viewBox="0 0 700 470" aria-label="${flat?'平面布局画布':'仓库三维示意预览'}"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0v20" fill="none" stroke="#dbe4ed" stroke-width=".6"/></pattern></defs><g transform="translate(${350*(1-zoom)},${235*(1-zoom)}) scale(${zoom})">${flat?'<rect x="70" y="65" width="560" height="340" fill="url(#grid)" stroke="#a3b5c8" stroke-width="3"/><text x="350" y="45" text-anchor="middle" class="label">12.00 m</text><text x="28" y="235" class="label">8 m</text>':'<path d="M40 350L180 100L665 190L570 440Z" fill="#e0e8ed" stroke="#cad6df"/>'}${shapes}</g></svg>`}
function detail(){const r=records[selected];return `<div class="panelhead"><div><h2>${page==='cells'?'格位属性':'格位库存'}</h2><p class="muted">${r.code}</p></div><button data-action="panel" aria-label="关闭详情">×</button></div>${page==='inventory'?`<div class="section"><span class="status">${r.status}</span><h2 style="margin:20px 0 6px">${r.sku}</h2><div class="metric"><b>${r.qty} <span class="muted">件</span></b></div><p class="muted">批次 DEMO-0917 · 来源 ERP 示例</p></div><div class="section"><h3>空间信息</h3><p class="muted">${r.name}</p><p class="muted">承重上限 ${r.load} kg · 实际重量未知</p></div><div class="section"><h3>当前搜索结果</h3>${records.filter(match).slice(0,4).map(x=>`<button class="record" data-id="${x.id}"><strong>${x.sku}<span class="badge" style="float:right">${x.qty} 件</span></strong><span class="muted">${x.code}</span></button>`).join('')||'<p class="muted">无匹配结果，试试清除关键词。</p>'}</div>`:`<div class="section"><span class="badge">${chosen.size?'已选 '+chosen.size+' 格 · 以下修改应用到所选':'单格编辑'}</span><label class="field">格位名称<input id="cellName" value="${esc(r.name)}"></label><label class="field">状态<select id="cellStatus"><option ${r.status==='正常'?'selected':''}>正常</option><option ${r.status==='盘点标记'?'selected':''}>盘点标记</option><option>锁定标记</option></select></label><label class="field">承重上限（kg）<input type="number" min="0" id="cellLoad" value="${r.load}"></label><p class="muted">空间标记不影响 ERP 出入库。</p></div><div class="section"><h3>现场照片</h3><p class="muted">暂无照片</p><button data-action="photo">＋ 添加照片</button></div><div class="panelactions"><button class="primary" data-action="saveCell">保存${chosen.size?'所选格位':'属性'}</button><button data-action="resetCell">取消修改</button></div>`}`}
function match(r){return (!query||[r.code,r.name,r.sku].some(x=>x.toLowerCase().includes(query.toLowerCase())))&&(!filter||r.status==='盘点标记')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const title={inventory:'库存查看',design:'空间设计',cells:'格位管理',system:'系统管理'}[page];const intro={inventory:'查看空间分布，快速定位库存与格位',design:'调整货架与空间结构，修改先保存为草稿',cells:'筛选格位，集中维护属性和现场信息',system:'接入状态、访问权限与运行维护'}[page];let out=`<div class="pagehead"><div><h1>${title}</h1><span class="muted">${intro}</span></div><div class="row">${page==='design'?`<span class="muted">${dirty?'● 未保存草稿':'已保存'}</span><button data-action="discard">放弃</button><button class="primary" data-action="saveDesign">保存布局</button>`:'<button data-action="sync">● 来源状态</button>'}</div></div>`;
if(page==='system'){out+='<div class="system"><span class="badge">管理入口规划</span><h2 style="margin-top:18px">接入与运行状态</h2><p>正式接入后按「数据接入」「账号权限」「审计与备份」组织。此次先评审三个主要业务工作区，此处不模拟真实同步和权限变更。</p><button data-action="sync">查看示例来源状态</button></div>';document.getElementById('workspace').innerHTML=out;return}
out+=`<div class="toolbar"><select aria-label="当前库区"><option>主仓库 / 1号库区</option></select>${page==='design'?'<button data-action="undo">↶ 撤销</button><span class="muted">选择货架 → 修改右侧属性 → 应用草稿</span>':`<input type="search" id="query" placeholder="搜索名称、SKU、格位编码" value="${esc(query)}"><button data-action="search">搜索</button><button data-action="filter">${filter?'清除盘点筛选':'筛选'}</button>`}<span class="spacer"></span><button data-action="panel">${panelOpen?'收起详情':'打开详情'}</button></div>`;
if(page==='design'){out+=`<div class="body"><div class="tree"><h3>空间对象</h3><span class="muted">货架 · 3</span>${Object.keys(drafts).map(k=>`<button data-rack="${k}" class="${rack===k?'active':''}">▧ ${esc(drafts[k].name)}</button>`).join('')}<hr style="border:0;border-top:1px solid #edf0f4;margin:20px 0"><span class="muted">门窗 · 示意</span><button data-action="opening">后墙入口</button></div><div class="canvas"><div class="canvashead"><span class="pill">平面布局</span><span class="pill">单位：米</span></div>${scene(true)}${viewtools()}</div><aside class="panel ${panelOpen?'':'hidden'}"><div class="panelhead"><h2>${esc(drafts[rack].name)}</h2><span class="badge">货架</span></div><div class="section"><h3>基本信息</h3><label class="field">名称<input id="rackName" value="${esc(drafts[rack].name)}"></label><div class="two"><label class="field">X 位置（m）<input type="number" id="rackX" value="${drafts[rack].x}" step=".1"></label><label class="field">Z 位置（m）<input type="number" id="rackZ" value="${drafts[rack].z}" step=".1"></label></div><label class="field">旋转角度（°）<input type="number" id="rackAngle" value="${drafts[rack].angle}" step="15"></label></div><div class="section"><h3>规格</h3><p class="muted">1.2 × 0.5 × 2 m</p><p class="muted">5 层 × 6 列 · 30 个格位</p></div><div class="panelactions"><button class="primary" data-action="apply">应用到草稿</button></div></aside></div>`}
else if(page==='inventory'){out+=`<div class="body"><div class="canvas"><div class="canvashead"><span class="pill">90 格位 <span style="color:#9aa7b4">/</span> 示例库存分布</span><span class="pill">三维示意</span></div>${scene()}${viewtools()}<span class="footnote">点击货架查看库存</span></div><aside class="panel ${panelOpen?'':'hidden'}">${detail()}</aside></div>`}
else{out+=`<div class="body"><div class="tablewrap"><div class="section row"><h3>${records.filter(match).length} 个格位</h3><span class="muted">${chosen.size?'已选 '+chosen.size+' 格':'可多选批量维护'}</span><button data-action="clearSelection" style="margin-left:auto">清除选择</button></div><table><thead><tr><th><input type="checkbox" id="all" aria-label="选择全部筛选结果" ${records.filter(match).length&&records.filter(match).every(r=>chosen.has(r.id))?'checked':''}></th><th>格位 / 名称</th><th>状态</th><th>承重</th></tr></thead><tbody>${records.filter(match).map(r=>`<tr data-id="${r.id}" class="${r.id===selected?'selected':''}"><td><input type="checkbox" data-check="${r.id}" aria-label="选择 ${r.code}" ${chosen.has(r.id)?'checked':''}></td><td><strong>${r.code}</strong><small>${esc(r.name)}</small></td><td><span class="${r.status==='正常'?'status':'badge'}">${r.status}</span></td><td>${r.load} kg</td></tr>`).join('')}</tbody></table>${records.filter(match).length?'':'<div class="empty">没有匹配的格位，请修改筛选条件。</div>'}</div><aside class="panel ${panelOpen?'':'hidden'}">${detail()}</aside></div>`}
document.getElementById('workspace').innerHTML=out;}
function viewtools(){return '<div class="viewtools"><button data-action="minus" aria-label="缩小">−</button><button data-action="fit">适应窗口</button><button data-action="plus" aria-label="放大">＋</button></div>'}
document.addEventListener('click',e=>{if(e.target.matches('input[type=checkbox]'))return;const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;query='';filter=false;panelOpen=innerWidth>850;render();return}const obj=e.target.closest('[data-rack]');if(obj){rack=obj.dataset.rack;selected='ABC'.indexOf(rack)*6;panelOpen=true;render();return}const row=e.target.closest('[data-id]');if(row){selected=Number(row.dataset.id);panelOpen=true;render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;
if(a==='panel')panelOpen=!panelOpen;else if(a==='search'){query=document.getElementById('query').value;const found=records.find(match);if(found)selected=found.id;panelOpen=true}else if(a==='filter'){filter=!filter;const found=records.find(match);if(found)selected=found.id}else if(a==='plus')zoom=Math.min(1.8,zoom+.2);else if(a==='minus')zoom=Math.max(.6,zoom-.2);else if(a==='fit')zoom=1;else if(a==='clearSelection')chosen.clear();else if(a==='saveCell'){const name=document.getElementById('cellName').value.trim(),load=Number(document.getElementById('cellLoad').value),status=document.getElementById('cellStatus').value;if(!name||!Number.isFinite(load)||load<0){notify('请填写名称和有效承重');return}for(const id of chosen.size?chosen:[selected])Object.assign(records[id],{name,load,status});notify('已更新原型示例，未写入业务系统')}else if(a==='apply'){const name=document.getElementById('rackName').value.trim(),x=Number(document.getElementById('rackX').value),z=Number(document.getElementById('rackZ').value),angle=Number(document.getElementById('rackAngle').value);if(!name||![x,z,angle].every(Number.isFinite)){notify('请填写有效属性');return}history.push(structuredClone(drafts));drafts[rack]={name,x,z,angle};dirty=true}else if(a==='undo'){const prev=history.pop();if(prev)Object.assign(drafts,prev);dirty=JSON.stringify(drafts)!==JSON.stringify(baseline)}else if(a==='discard'){Object.assign(drafts,structuredClone(baseline));history=[];dirty=false;notify('已放弃原型草稿')}else if(a==='saveDesign'){baseline=structuredClone(drafts);history=[];dirty=false;notify('原型草稿已保存至内存，刷新后恢复')}else if(a==='sync'){notify('示例来源：ERP · 等待正式接入；此原型未读取实时库存');return}else if(a==='photo'||a==='opening'){notify('此入口展示位置规划，正式接入时复用现有功能');return}render();});
document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const id=Number(e.target.dataset.check);e.target.checked?chosen.add(id):chosen.delete(id);render()}if(e.target.id==='all'){for(const r of records.filter(match))e.target.checked?chosen.add(r.id):chosen.delete(r.id);render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='query'&&e.key==='Enter')document.querySelector('[data-action=search]').click()});render();
</script>
</html>
