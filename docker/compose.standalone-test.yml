# open supOS 独立库存验收实例，使用单独数据卷和路由。
name: warehouse-standalone-test
services:
  warehouse:
    image: opensupos-spatial-warehouse:standalone-uns-merge-20260919
    build:
      context: ..
      dockerfile: docker/Dockerfile.supos
    container_name: warehouse-standalone-test
    restart: unless-stopped
    environment:
      PORT: 3000
      SPATIAL_AUTH_PROVIDER: supos
      SPATIAL_MODE: standalone
      SPATIAL_BASE_PATH: /warehouse-standalone
      SPATIAL_PUBLIC_ORIGIN: http://localhost:28088
      SUPOS_USERINFO_URL: http://backend:8080/inter-api/supos/auth/userinfo
      SPATIAL_DATA_DIR: /data
      SPATIAL_UPLOAD_DIR: /uploads
      OUTBOUND_INTERVAL_MS: 5000
      SUPOS_MQTT_URL: mqtt://emqx:1883
      SUPOS_INTERNAL_API: http://backend:8080
      SUPOS_UNS_EVENT_ALIAS: warehouse3d_candidate_events
      SUPOS_UNS_EVENT_PATH: Warehouse3D_Lab/candidate_events
      SUPOS_WAREHOUSE_SITE: WH
      SUPOS_WAREHOUSE_ALIAS: warehouse3d_candidate_structure
      SUPOS_WAREHOUSE_NAME: CandidateWarehouse
      SUPOS_WAREHOUSE_INTERVAL_MS: 15000
      SUPOS_WAREHOUSE_REGISTER: 1
      SUPOS_WAREHOUSE_UPDATE: 1
    volumes:
      - inventory:/data
      - assets:/uploads
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  platform:
    external: true
    name: opensupos-lab-default_network
volumes:
  inventory:
  assets:
